[package]
name = "aeondevhub"
version = "0.1.0"
description = "Personal dev hub: every project with git status, last commit, TODOs and one-click open in editor"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "aeondevhub_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
regex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
